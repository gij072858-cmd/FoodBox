name: foodbox
description: "食匣 FoodBox — 像网易云用歌单管理音乐一样，用「库—菜式—时序」管理你的厨房。"
publish_to: 'none'

# 版本号：里程碑打 tag 时同步递增（main 分支每周五更新）
version: 1.0.0+1

environment:
  # 统一 SDK 版本，见 docs/Flutter环境搭建指南.md
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  # 中文本地化资源（Material / Cupertino 控件文案）
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ---- 状态管理（总计划第三章技术定案）----
  flutter_riverpod: ^3.4.3

  # ---- 路由 ----
  go_router: ^18.0.1

  # ---- 本地数据库 ----
  drift: ^2.35.0
  # 官方推荐的 drift Flutter 接入层：负责数据库落盘位置与原生库装配
  drift_flutter: ^0.3.1
  path: ^1.9.1

  # ---- 工具 ----
  intl: ^0.20.3
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # drift 代码生成：改表结构后执行（统一加 --force-jit，见环境指南第六节）
  #   dart run build_runner build --force-jit
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true

  assets:
    # 预置数据与素材目录（W2 起逐批填充）
    # 目录内文件按模块命名：food_items.json / recipes.json / alias_map.json
    - assets/data/
    - assets/images/
